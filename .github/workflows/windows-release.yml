name: Windows release artifacts

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2022
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check version and install Rust
        run: |
          $cargo = Get-Content Cargo.toml -Raw
          $match = [regex]::Match($cargo, '(?m)^version\s*=\s*"(\d+\.\d+\.\d+)"')
          if (-not $match.Success) { throw 'Expected a stable Cargo version.' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne ('v' + $match.Groups[1].Value)) {
            throw 'The Git tag must match Cargo.toml.'
          }
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal --component rustfmt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup override set stable-x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build portable EXE
        run: .\scripts\build.ps1 -SkipTests
      - name: Package source and checksums
        run: .\scripts\package.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: SlimStore-Windows-x64
          if-no-files-found: error
          path: |
            dist/SlimStore.exe
            release/*-source.zip
            release/SHA256SUMS.txt
