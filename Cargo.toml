[package]
name = "slimstore"
version = "1.0.1"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-only"
description = "A portable native WinGet app store. Discover. Install. Update."
build = "build.rs"

[[bin]]
name = "SlimStore"
path = "src/main.rs"

[dependencies]
slint = { version = "=1.19.0", default-features = false, features = ["std", "backend-winit", "renderer-software", "accessibility", "compat-1-18", "raw-window-handle-06"] }
raw-window-handle = "=0.6.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = { version = "2.2", default-features = false, features = ["deserialize"] }
unicode-width = "0.2"
zip = { version = "9.8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
image = { version = "0.25", default-features = false, features = ["ico", "jpeg"] }
windows-sys = { version = "0.61", features = ["Win32_Security", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Diagnostics_ToolHelp", "Win32_Networking_WinHttp", "Win32_System_Registry", "Win32_Storage_Packaging_Appx", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_Graphics_Dwm", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi"] }

[build-dependencies]
slint-build = "=1.19.0"
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
